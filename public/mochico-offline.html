<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#09090b">
<title>オフライン | Mochico</title>
<style>
  :root { color-scheme: light dark; --bg:#ffffff; --fg:#0f172a; --muted:#475569; --card:#f1f5f9; --btn:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#09090b; --fg:#f8fafc; --muted:#94a3b8; --card:#18181b; --btn:#2563eb; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.7; }
  main { max-width:420px; width:100%; text-align:center; }
  .icon { width:64px; height:64px; margin:0 auto 20px; border-radius:16px; display:flex; align-items:center; justify-content:center;
          background:linear-gradient(135deg,#ec4899,#c026d3); }
  h1 { font-size:18px; margin:0 0 8px; }
  p { margin:0 0 12px; color:var(--muted); font-size:14px; }
  ul { text-align:left; background:var(--card); border-radius:14px; padding:14px 16px 14px 32px; margin:16px 0 24px; font-size:13px; color:var(--muted); }
  button { min-height:44px; width:100%; border:0; border-radius:12px; background:var(--btn); color:#fff; font-size:15px; font-weight:700; }
  button:focus-visible { outline:3px solid #93c5fd; outline-offset:2px; }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.2 4.2L19 7" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h1>インターネットに接続されていません</h1>
  <p>Mochicoは、通信できる状態で使うアプリです。電波の良い場所で、もう一度お試しください。</p>
  <ul>
    <li>取得状況の変更・グッズの登録は、通信が戻ってから行えます。</li>
    <li>このページにあなたのデータは保存されていません。</li>
  </ul>
  <button type="button" onclick="location.reload()">再読み込み</button>
</main>
</body>
</html>
